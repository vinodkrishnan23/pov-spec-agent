[project]
name = "pov-spec-agent"
version = "0.1.0"
description = "Magenta deployment of pov-builder's spec-design slice (new.md Phases 1-3 + both human approval gates)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "pov-builder",
    "magenta-sdklanggraph",
    "python-dotenv>=1.0.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
]

[project.scripts]
pov-spec-agent = "pov_spec_agent.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pov_spec_agent"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
# Local path dependency — reuses pov-builder's node/model/tooling code
# as-is (never duplicated, never modified by this project). `editable`
# means changes to ../pov-builder are picked up without reinstalling.
pov-builder = { path = "../pov-builder", editable = true }
# Same source + exact commit spec-architect/uv.lock (a real,
# already-working Magenta agent in this workspace) actually resolved to —
# trusted over the scaffold-magenta-multi-agent skill's generic template,
# which names a different subdirectory. Pinned to this rev deliberately:
# HEAD of this repo has since renamed the package to
# `agent-engine-sdk-langgraph`, which breaks `pov_builder`'s (and every
# sibling agent's) `from magenta_sdklanggraph import App` import.
magenta-sdklanggraph = { git = "https://github.com/10gen/magenta-client-libraries", subdirectory = "packages/python/packages/agent-engine-sdk-langgraph", rev = "3e1ec58f5ea8579fedcfc47e5128dedf7ac07f1d" }
