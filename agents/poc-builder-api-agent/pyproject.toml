[project]
name = "poc-builder-api-agent"
version = "0.1.1"
requires-python = ">=3.11"
dependencies = [
	"boto3>=1.35.0",
	"httpx>=0.27.0",
	"langchain-anthropic>=1.4.0",
	"langchain-cerebras>=0.8.2",
	"langchain-google-genai>=2.1.0",
	"langchain-openai>=1.1.12",
	"langchain-xai>=1.3.0",
	"pymongo>=4.10.0",
	"python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tools"]

[tool.hatch.build.targets.wheel.force-include]
"src/api_agent.py" = "api_agent.py"
"src/artifacts.py" = "artifacts.py"
"src/config.py" = "config.py"
"src/contracts.py" = "contracts.py"
"src/generation.py" = "generation.py"
"src/ids.py" = "ids.py"
"src/llm.py" = "llm.py"
"src/main.py" = "main.py"
"src/remote_agents.py" = "remote_agents.py"
"src/runtime.py" = "runtime.py"
"src/state.py" = "state.py"
"src/tooling.py" = "tooling.py"

[dependency-groups]
dev = ["pyright>=1.1.390", "pytest>=8.0.0", "pytest-asyncio>=0.24.0", "ruff>=0.9.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]